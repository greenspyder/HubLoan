name: Agent checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            server/package-lock.json
      - name: Install video render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core espeak-ng
          ffmpeg -version
          ffprobe -version
      - run: npm ci --prefix server
      - run: npm test --prefix server
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: cd frontend && npx eslint src/features/agents src/app/App.tsx vite.config.ts
